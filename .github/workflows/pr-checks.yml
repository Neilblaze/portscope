name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install

      - run: node src/index.js --help

      - run: node --check src/index.js
      - run: node --check src/config/schema.js
      - run: node --check src/config/loader.js
      - run: node --check src/config/models.js
      - run: node --check src/ai/client.js
      - run: node --check src/ai/conversation.js
      - run: node --check src/ai/executor.js
      - run: node --check src/ai/tools.js

      - run: pnpm test

  test-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ./website
        run: pnpm install

      - name: Lint website
        working-directory: ./website
        run: pnpm run lint

      - name: Build website
        working-directory: ./website
        run: pnpm run build
