name: ✨ Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement to PortScope!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution or API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / Commands
        - AI Chat
        - Port Scanning
        - UI / Display
        - Configuration
        - Documentation
        - Other
    validations:
      required: true
